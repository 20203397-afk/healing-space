<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>당신에게 힘든 일은 무엇인가요</title>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-burgundy: #5e1f26;
      --bg-dark-burgundy: #3b1116;
      --bg-light-burgundy: #7a2b34;
      --accent-gold: #f4d068;
      --accent-rose: #e8998d;
      --text-main: #fcf8f6;
      --text-sub: #e2c2c6;
      --glass-bg: rgba(94, 31, 38, 0.45);
      --glass-border: rgba(232, 153, 141, 0.25);
      --glass-card: rgba(59, 17, 22, 0.65);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: radial-gradient(circle at center, var(--bg-burgundy) 0%, var(--bg-dark-burgundy) 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-x: hidden;
      position: relative;
      padding: 20px 15px 60px;
    }

    #starCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 680px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin-top: 20px;
    }

    header {
      text-align: center;
      padding: 20px 10px;
    }

    header h1 {
      font-family: 'Gowun Batang', serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text-main);
      text-shadow: 0 0 15px rgba(232, 153, 141, 0.4);
      margin-bottom: 10px;
      word-break: keep-all;
    }

    header p {
      font-size: 1rem;
      color: var(--text-sub);
      font-weight: 300;
      line-height: 1.6;
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 6px;
    }

    .tag {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(232, 153, 141, 0.3);
      color: var(--text-sub);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tag.active, .tag:hover {
      background: var(--accent-rose);
      color: #3b1116;
      border-color: var(--accent-rose);
      font-weight: 500;
    }

    textarea {
      width: 100%;
      height: 140px;
      background: rgba(30, 8, 11, 0.6);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 16px;
      color: var(--text-main);
      font-family: 'Gowun Batang', serif;
      font-size: 1.05rem;
      line-height: 1.7;
      resize: none;
      outline: none;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    textarea:focus {
      border-color: var(--accent-rose);
      box-shadow: 0 0 12px rgba(232, 153, 141, 0.3);
    }

    textarea::placeholder {
      color: rgba(226, 194, 198, 0.5);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--bg-light-burgundy), var(--accent-rose));
      border: none;
      border-radius: 12px;
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(122, 43, 52, 0.4);
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(232, 153, 141, 0.4);
    }

    .response-card {
      display: none;
      background: var(--glass-card);
      border: 1px solid rgba(244, 208, 104, 0.3);
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .response-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      color: var(--accent-gold);
      font-family: 'Gowun Batang', serif;
      font-size: 1.2rem;
    }

    .response-content {
      font-family: 'Gowun Batang', serif;
      font-size: 1.1rem;
      line-height: 1.85;
      color: #fdfaf7;
      white-space: pre-wrap;
      margin-bottom: 20px;
    }

    .response-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--glass-border);
      color: var(--text-sub);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .loading-box {
      display: none;
      text-align: center;
      padding: 20px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(232, 153, 141, 0.2);
      border-top: 3px solid var(--accent-rose);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .widgets-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 520px) {
      .widgets-grid { grid-template-columns: 1fr; }
    }

    .widget-title {
      font-size: 0.95rem;
      color: var(--accent-gold);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .breath-box {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .breath-circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(232, 153, 141, 0.15);
      border: 2px solid var(--accent-rose);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 10px 0;
      transition: transform 4s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: 'Gowun Batang', serif;
      font-size: 0.95rem;
      color: var(--accent-gold);
    }

    .breath-circle.inhale { transform: scale(1.35); background: rgba(232, 153, 141, 0.35); }
    .breath-circle.hold { transform: scale(1.35); background: rgba(244, 208, 104, 0.35); border-color: var(--accent-gold); }
    .breath-circle.exhale { transform: scale(1); background: rgba(232, 153, 141, 0.1); }

    .candle-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .candle-flame {
      font-size: 2rem;
      cursor: pointer;
      filter: drop-shadow(0 0 10px rgba(244, 208, 104, 0.8));
      transition: transform 0.2s ease;
      margin-bottom: 6px;
    }

    .candle-flame:hover { transform: scale(1.2); }

    .temp-bar-bg {
      width: 100%;
      height: 10px;
      background: rgba(0,0,0,0.4);
      border-radius: 5px;
      overflow: hidden;
      margin-top: 8px;
    }

    .temp-bar-fill {
      width: 36.5%;
      height: 100%;
      background: linear-gradient(90deg, var(--bg-light-burgundy), var(--accent-rose), var(--accent-gold));
      transition: width 0.5s ease;
    }

    .quote-box {
      grid-column: 1 / -1;
      text-align: center;
    }

    .quote-text {
      font-family: 'Gowun Batang', serif;
      font-size: 1rem;
      color: var(--text-main);
      margin: 8px 0;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      color: rgba(226, 194, 198, 0.4);
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <canvas id="starCanvas"></canvas>

  <div class="container">
    <header>
      <h1>당신에게 힘든 일은 무엇인가요</h1>
      <p>말없이 품고 있던 마음의 짐을 이곳에 부어주세요.<br>따뜻한 공감과 위로의 한마디를 전해드립니다.</p>
    </header>

    <main class="glass-panel">
      <div class="form-group">
        <label style="font-size: 0.9rem; color: var(--text-sub);">고민의 주제를 선택해 주세요 (선택)</label>
        <div class="tag-container" id="tagContainer">
          <span class="tag" data-tag="학업/진로">#학업/진로</span>
          <span class="tag" data-tag="인간관계">#인간관계</span>
          <span class="tag" data-tag="번아웃/피로">#번아웃/피로</span>
          <span class="tag" data-tag="가족/연애">#가족/연애</span>
          <span class="tag" data-tag="불안/자존감">#불안/자존감</span>
        </div>

        <textarea id="worryInput" placeholder="오늘 당신을 밤잠 이루지 못하게 하는 마음 속 이야기를 편하게 적어주세요..."></textarea>
        
        <button class="btn-submit" id="submitBtn">
          <span>✨ 따뜻한 위로 받기</span>
        </button>
      </div>

      <div class="loading-box" id="loadingBox">
        <div class="spinner"></div>
        <p style="font-size: 0.9rem; color: var(--text-sub);">당신의 마음에 전할 따뜻한 한마디를 다듬고 있습니다...</p>
      </div>
    </main>

    <section class="glass-panel response-card" id="responseCard">
      <div class="response-header">
        <span>💌</span>
        <span>당신만을 위한 위로의 편지</span>
      </div>
      <div class="response-content" id="responseText"></div>
      <div class="response-actions">
        <button class="action-btn" id="flyWorryBtn">🌌 고민을 별빛으로 날려보내기</button>
        <button class="action-btn" id="copyBtn">📋 문장 복사</button>
      </div>
    </section>

    <div class="widgets-grid">
      <div class="glass-panel breath-box">
        <div class="widget-title">🫁 4-7-8 마음 호흡</div>
        <div class="breath-circle" id="breathCircle">준비</div>
        <button class="action-btn" id="breathBtn" style="margin-top:6px;">호흡 시작하기</button>
      </div>

      <div class="glass-panel candle-box">
        <div class="widget-title">🕯️ 촛불 켜기</div>
        <div class="candle-flame" id="candleFlame" title="클릭해서 마음의 온도를 올려보세요">🕯️</div>
        <div style="font-size:0.85rem; color:var(--text-sub);" id="tempText">현재 마음 온도: 36.5°C</div>
        <div class="temp-bar-bg">
          <div class="temp-bar-fill" id="tempBar"></div>
        </div>
      </div>

      <div class="glass-panel quote-box">
        <div class="widget-title" style="justify-content: center;">📜 힐링 명언 서랍</div>
        <div class="quote-text" id="quoteText">"당신이 견뎌낸 오늘 하루는 이미 충분히 가치 있고 아름답습니다."</div>
        <button class="action-btn" id="nextQuoteBtn" style="margin-top: 8px;">새로운 명언 뽑기</button>
      </div>
    </div>

    <footer>
      <p>© 힐링 쉼터 — 당신의 마음에 따뜻한 빛이 깃들길 바랍니다.</p>
    </footer>
  </div>

  <script>
    const canvas = document.getElementById('starCanvas');
    const ctx = canvas.getContext('2d');
    let stars = [];
    let shootingStars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Star {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 1.8 + 0.5;
        this.alpha = Math.random();
        this.speed = Math.random() * 0.015 + 0.005;
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
      update() {
        this.alpha += this.speed;
        if (this.alpha > 1 || this.alpha < 0.1) { this.speed = -this.speed; }
      }
    }

    for (let i = 0; i < 120; i++) { stars.push(new Star()); }

    function animateStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(star => { star.update(); star.draw(); });

      if (Math.random() < 0.015) {
        shootingStars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * (canvas.height / 2),
          length: Math.random() * 80 + 40,
          speed: Math.random() * 6 + 4,
          alpha: 1
        });
      }

      for (let i = shootingStars.length - 1; i >= 0; i--) {
        let s = shootingStars[i];
        ctx.strokeStyle = `rgba(244, 208, 104, ${s.alpha})`;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(s.x - s.length, s.y + s.length * 0.5);
        ctx.stroke();

        s.x += s.speed;
        s.y += s.speed * 0.5;
        s.alpha -= 0.02;

        if (s.alpha <= 0) { shootingStars.splice(i, 1); }
      }

      requestAnimationFrame(animateStars);
    }
    animateStars();

    let selectedTag = "";
    document.querySelectorAll('.tag').forEach(tag => {
      tag.addEventListener('click', () => {
        document.querySelectorAll('.tag').forEach(t => t.classList.remove('active'));
        if (selectedTag === tag.dataset.tag) {
          selectedTag = "";
        } else {
          tag.classList.add('active');
          selectedTag = tag.dataset.tag;
        }
      });
    });

    const submitBtn = document.getElementById('submitBtn');
    const worryInput = document.getElementById('worryInput');
    const loadingBox = document.getElementById('loadingBox');
    const responseCard = document.getElementById('responseCard');
    const responseText = document.getElementById('responseText');

    const fallbackComforts = [
      "지금 마음이 많이 무겁고 지치셨군요. 그 무게를 혼자 짊어지느라 얼마나 애쓰셨을지 마음이 아픕니다.\n\n남들과 비교하지 않아도 괜찮아요. 지금 이 순간 당신이 견뎌내고 있는 것만으로도 당신은 이미 소중하고 다정한 사람입니다.\n\n잠시 어깨의 짐을 내려놓고 마음껏 숨을 쉬어보세요. 이 밤이 지나면 당신의 마음에도 따스한 햇살이 번지길 기원합니다.",
      "힘든 일을 밖으로 꺼내어 놓은 것만으로도 당신은 용기를 낸 것입니다.\n\n세상이 맘처럼 흘러가지 않아 마음 상할 때가 있지요. 하지만 당신의 잘못이 아니에요.\n\n오늘 밤은 스스로에게 '참 고생 많았다'고 조용히 속삭여주세요. 당신은 응원받을 자격이 충분한 사람입니다.",
      "마음 속 깊은 고민을 털어놓아 주셔서 고마워요. 매일 묵묵히 버텨내는 당신의 뒷모습에 따스한 안아줌을 전하고 싶습니다.\n\n완벽하지 않아도 괜찮습니다. 흔들리면서 피어나는 꽃처럼, 당신의 고단함도 결국 피어날 성장의 과정일 거예요. 힘내세요."
    ];

    submitBtn.addEventListener('click', async () => {
      const text = worryInput.value.trim();
      if (!text) {
        alert("마음속 고민을 조금이라도 적어주세요.");
        return;
      }

      submitBtn.disabled = true;
      loadingBox.style.display = 'block';
      responseCard.style.display = 'none';

      const prompt = `사용자가 작성한 고민 내용: "${text}" ${selectedTag ? `(카테고리: ${selectedTag})` : ''}
너는 따뜻하고 공감 능력이 뛰어난 힐링 멘토이자 친근한 친구야. 
사용자의 고민을 깊이 공감해주고, 평가나 지적 없이 마음을 보듬어주는 다정하고 진정성 있는 위로 편지(약 300~400자 내외)를 작성해줘. 
문단 구분을 자연스럽게 해줘.`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

        const data = await response.json();
        let reply = data.candidates?.[0]?.content?.parts?.[0]?.text;

        if (!reply) { reply = fallbackComforts[Math.floor(Math.random() * fallbackComforts.length)]; }

        responseText.textContent = reply;
        loadingBox.style.display = 'none';
        responseCard.style.display = 'block';
        responseCard.scrollIntoView({ behavior: 'smooth' });

      } catch (err) {
        const reply = fallbackComforts[Math.floor(Math.random() * fallbackComforts.length)];
        responseText.textContent = reply;
        loadingBox.style.display = 'none';
        responseCard.style.display = 'block';
        responseCard.scrollIntoView({ behavior: 'smooth' });
      } finally {
        submitBtn.disabled = false;
      }
    });

    const flyWorryBtn = document.getElementById('flyWorryBtn');
    flyWorryBtn.addEventListener('click', () => {
      for (let i = 0; i < 40; i++) {
        shootingStars.push({
          x: Math.random() * canvas.width,
          y: canvas.height,
          length: Math.random() * 100 + 50,
          speed: Math.random() * 12 + 6,
          alpha: 1
        });
      }
      alert("당신의 고민이 밤하늘 별 가루가 되어 멀리 날아갔습니다. 마음을 가볍게 비워내세요 ✨");
      worryInput.value = "";
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
      navigator.clipboard.writeText(responseText.textContent);
      alert("위로의 문장이 복사되었습니다.");
    });

    const breathCircle = document.getElementById('breathCircle');
    const breathBtn = document.getElementById('breathBtn');
    let isBreathing = false;
    let breathTimer = null;

    breathBtn.addEventListener('click', () => {
      if (isBreathing) {
        clearInterval(breathTimer);
        isBreathing = false;
        breathCircle.className = "breath-circle";
        breathCircle.textContent = "준비";
        breathBtn.textContent = "호흡 시작하기";
        return;
      }

      isBreathing = true;
      breathBtn.textContent = "호흡 멈추기";
      runBreathCycle();
      breathTimer = setInterval(runBreathCycle, 19000);
    });

    function runBreathCycle() {
      breathCircle.className = "breath-circle inhale";
      breathCircle.textContent = "들숨 (4초)";
      
      setTimeout(() => {
        if (!isBreathing) return;
        breathCircle.className = "breath-circle hold";
        breathCircle.textContent = "참기 (7초)";
      }, 4000);

      setTimeout(() => {
        if (!isBreathing) return;
        breathCircle.className = "breath-circle exhale";
        breathCircle.textContent = "날숨 (8초)";
      }, 11000);
    }

    const candleFlame = document.getElementById('candleFlame');
    const tempText = document.getElementById('tempText');
    const tempBar = document.getElementById('tempBar');
    let currentTemp = 36.5;

    candleFlame.addEventListener('click', () => {
      if (currentTemp < 40.0) {
        currentTemp += 0.5;
        candleFlame.style.transform = "scale(1.4)";
        setTimeout(() => candleFlame.style.transform = "scale(1.2)", 200);

        tempText.textContent = `현재 마음 온도: ${currentTemp.toFixed(1)}°C`;
        const percentage = Math.min(100, ((currentTemp - 35) / 5) * 100);
        tempBar.style.width = `${percentage}%`;

        if (currentTemp >= 40.0) {
          tempText.textContent = `현재 마음 온도: 40.0°C (따뜻한 온기가 마음 가득 찼습니다 ❤️)`;
        }
      }
    });

    const quotes = [
      "\"당신이 견뎌낸 오늘 하루는 이미 충분히 가치 있고 아름답습니다.\"",
      "\"밤이 깊을수록 별은 더욱 밝게 빛납니다. 당신의 어둠도 곧 빛으로 바뀔 거예요.\"",
      "\"길을 잃은 것이 아니라, 나만의 길을 찾아가는 과정입니다.\"",
      "\"쉼은 게으름이 아니라, 더 먼 항해를 위한 거룩한 준비입니다.\"",
      "\"오늘 하루도 참 고생 많았습니다. 당신은 존재만으로도 소중합니다.\"",
      "\"바람이 불지 않으면 노를 저어라. 어떠한 순간에도 당신은 앞으로 나아가고 있습니다.\""
    ];
    let quoteIdx = 0;
    const quoteText = document.getElementById('quoteText');
    const nextQuoteBtn = document.getElementById('nextQuoteBtn');

    nextQuoteBtn.addEventListener('click', () => {
      quoteIdx = (quoteIdx + 1) % quotes.length;
      quoteText.style.opacity = 0;
      setTimeout(() => {
        quoteText.textContent = quotes[quoteIdx];
        quoteText.style.opacity = 1;
      }, 200);
    });
  </script>
</body>
</html>
